[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vit-image-classifier"
version = "0.2.0"
description = "A Vision Transformer image classifier written from scratch in PyTorch, with a Streamlit demo."
readme = "README.md"
authors = [{ name = "Ismail Ben Alla" }]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pillow>=10",
  "torch>=2.2",
  "torchvision>=0.17",
]

[project.scripts]
vit-train = "vit_classifier.train:main"
vit-predict = "vit_classifier.predict:main"
vit-evaluate = "vit_classifier.evaluate:main"

[project.optional-dependencies]
app = ["streamlit>=1.50"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9", "nbformat>=5", "streamlit>=1.50"]

[tool.hatch.build.targets.wheel]
packages = ["src/vit_classifier"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["legacy", "*.ipynb", "*.md"]  # generated notebook; hand-aligned docs

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"notebooks/build_notebook.py" = ["E501"]  # Markdown tables inside strings
